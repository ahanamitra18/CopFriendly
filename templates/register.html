<!DOCTYPE html>
<html>
<head>
    <title>Citizen Registration - Cop Friendly</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Citizen Registration</h1>

        <p>Create your account to use Cop Friendly.</p>

        <form method="POST" action="/register">

            <label>Full Name</label><br>

            <input type="text"
                   name="name"
                   placeholder="Enter your full name"
                   required>

            <br><br>

            <label>Email</label><br>

            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <br><br>

            <label>Phone Number</label><br>

            <input type="text"
                   name="phone"
                   placeholder="Enter your phone number"
                   required>

            <br><br>

            <label>Password</label><br>

            <input type="password"
                   name="password"
                   placeholder="Create a password"
                   required>

            <br><br>

            <button type="submit">
                Register
            </button>

        </form>

        <br>

        <a href="/citizen">
            <button>Back to Citizen Portal</button>
        </a>

    </div>

</body>
</html>
