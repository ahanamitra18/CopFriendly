<!DOCTYPE html>
<html>
<head>
    <title>Submit Complaint - Cop Friendly</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Submit a Complaint</h1>

        <p>
            Please provide the details of your complaint.
        </p>

        <form method="POST" action="/complaint">

            <label>Complaint Type</label><br>

            <select name="complaint_type" required>

                <option value="">Select complaint type</option>

                <option value="Theft">Theft</option>

                <option value="Harassment">Harassment</option>

                <option value="Fraud">Fraud</option>

                <option value="Cyber Crime">Cyber Crime</option>

                <option value="Missing Person">Missing Person</option>

                <option value="Other">Other</option>

            </select>

            <br><br>

            <label>Location</label><br>

            <input type="text"
                   name="location"
                   placeholder="Enter incident location"
                   required>

            <br><br>

            <label>Complaint Description</label><br>

            <textarea name="description"
                      rows="6"
                      placeholder="Describe your complaint"
                      required></textarea>

            <br><br>

            <button type="submit">
                Submit Complaint
            </button>

        </form>

        <br>

        <a href="/citizen">
            <button>Back to Citizen Portal</button>
        </a>

    </div>

</body>
</html>
